<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BIS – Bidding Intelligence System: Hệ thống thông tin đấu thầu và dự án ODA tích hợp AI phân tích." />
    <title>BIS – Bidding Intelligence System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          var userJson = localStorage.getItem('user');
          var user = userJson ? JSON.parse(userJson) : null;
          var userKey = user ? (user.email || user.id) : null;
          var theme = (userKey && localStorage.getItem('bis_ui_theme_' + userKey)) || localStorage.getItem('bis_last_active_ui_theme') || 'basic';
          document.documentElement.setAttribute('data-ui-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
