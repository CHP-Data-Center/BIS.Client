server {
    listen 80;
    server_name localhost;

    # Chuyển tiếp API sang backend, để frontend và API DÙNG CHUNG một origin.
    # Nhờ vậy:
    #   - Không còn CORS (cùng origin thì trình duyệt không preflight, không chặn).
    #   - Không còn mixed content (API đi theo đúng http/https của trang).
    #   - Địa chỉ API là ĐƯỜNG DẪN TƯƠNG ĐỐI (/api/v1) nên mở bằng localhost, bằng IP nội
    #     bộ hay qua Cloudflare Tunnel đều chạy, KHÔNG phải build lại frontend khi đổi URL.
    #
    # host.docker.internal = máy host, nơi backend publish cổng 8080 (docker-compose của
    # BIS.Server map 8080:8080). Dùng cách này để không phải cho 2 compose project chung
    # network. Trên Docker Linux thì thêm extra_hosts trong docker-compose.yml.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Backend đọc X-Forwarded-For để rate-limit theo IP thật (app/utils/limiter.py).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tài liệu dự án / hồ sơ năng lực tải lên tới 15 MB (backend: MAX_DOCUMENT_BYTES).
        # Mặc định của nginx là 1 MB: file lớn hơn bị trả 413 TRƯỚC khi tới backend, và
        # người dùng chỉ thấy trang lỗi HTML chứ không thấy thông báo của hệ thống.
        # 110m = trần 100 MB của backend (MAX_DOCUMENT_MB) + phần đầu multipart.
        # Đổi trần bên backend thì phải đổi ở đây, nếu không hai bên lệch nhau.
        client_max_body_size 110m;

        # Trợ lý AI gọi Gemini mất tới ~50s; trích xuất + tóm tắt tài liệu bằng AI còn lâu
        # hơn, và tài liệu scan vài chục MB còn phải cộng thời gian TẢI LÊN trên đường
        # truyền chậm -> nới thời gian chờ, nếu không nginx cắt giữa chừng và người dùng
        # thấy 504 dù backend vẫn đang làm việc.
        client_body_timeout   600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
